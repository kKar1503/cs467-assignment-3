name: CI
on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci

  triage-config:
    # Deterministic checks on the triage agent's configuration and helper scripts.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - run: node --test .claude/skills/issue-triage/scripts/*.test.mjs
      - run: node .claude/skills/issue-triage/scripts/check-config.mjs
      - run: node evals/golden/score.mjs --self-test
